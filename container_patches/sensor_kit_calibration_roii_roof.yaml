# CARLA sensor kit calibration (in base_link frame)
# Frames: base_link at rear axle center on ground (x forward, y right, z up).
# Conversion from CARLA vehicle origin ("car center") to base_link:
#   x_base = x_car_center + 1.425  (WB=2.850 m)
#   y_base = y_car_center
#   z_base = z_car_center
#   rpy unchanged

sensor_kit_base_link:
  # Cameras (6 cams, 360°)
  CAM_FRONT/camera_link:
    x: 2.225 # 0.800 + 1.425
    y: 0.000
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  CAM_FRONT_LEFT/camera_link:
    x: 1.695 # 0.270 + 1.425
    y: -0.550
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: -0.959931 # -55 deg

  CAM_FRONT_RIGHT/camera_link:
    x: 1.695 # 0.270 + 1.425
    y: 0.550
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: 0.959931 # +55 deg

  CAM_BACK/camera_link:
    x: -0.575 # -2.000 + 1.425
    y: 0.000
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: 3.141593 # 180 deg

  CAM_BACK_LEFT/camera_link:
    x: 1.105 # -0.320 + 1.425
    y: -0.550
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: -1.919862 # -110 deg

  CAM_BACK_RIGHT/camera_link:
    x: 1.105 # -0.320 + 1.425
    y: 0.550
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: 1.919862 # +110 deg

  # LiDAR (roof)
  velodyne_top_base_link:
    x: 1.035 # -0.390 + 1.425
    y: 0.000
    z: 1.840
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  # GNSS (z = 0 aligns with the IMU/GNSS script assumption; adjust z to move it onto the roof)
  gnss_link:
    x: 0.025 # -1.400 + 1.425
    y: 0.000
    z: 0.000
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  # IMU (same placement rationale as GNSS)
  tamagawa/imu_link:
    x: 0.025 # -1.400 + 1.425
    y: 0.000
    z: 0.000
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  # ===== ROii "roof" profile (ROII_PROFILE=roof) -- single-sensor variant ====
  #
  # Sibling of sensor_kit_calibration_roii.yaml (the original 4-corner-mount
  # "low/mid/high" profiles, left completely untouched -- this is a separate
  # file/profile, not an in-place edit, precisely so the original tuned
  # placeholder mounts and their debugging history aren't lost).
  #
  # Why this variant exists: all 4 corner mounts in the original profile
  # self-occlude on the vehicle body for a real, yaw-independent ~90-115deg
  # dead zone (CARLA's RayCastSemanticLidar.cpp IgnoreActor only ignores the
  # sensor, never the parent vehicle -- filed upstream as
  # carla-simulator/carla#9804, not fixable from config). Rather than keep
  # 4 separately-spawned corner lidars each with a real blind spot, this
  # profile spawns exactly ONE lidar at roof height (roii_roof_lidar_base_link,
  # clear of the body silhouette from every azimuth), and
  # ros/roii_lidar_slicer.py republishes 4 azimuth-filtered copies of its
  # point cloud onto the same 4 topic names the rest of the pipeline
  # (fault_injector/health_monitor/concatenator) already expects. For that
  # slicing to place correctly, all 4 virtual frames below are declared
  # CO-LOCATED with the roof sensor (identical pose) -- the concatenator
  # transforms each named input by ITS OWN declared TF pose, and the
  # sliced points are still expressed in the roof sensor's own frame
  # (never rotated/translated), so the TF pose must match where the data
  # actually is, not the old physical corner position (see
  # sensor_kit_calibration_roii.yaml for those original placeholder values).
  roii_roof_lidar_base_link:
    x: 0.000
    y: 0.000
    z: 2.700  # above the roofline (2.660, per the old left/right pandar
              # comment) -- clear of the body silhouette from every azimuth,
              # same reasoning as why real AV rooftop lidars sit above the
              # greenhouse line.
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  roii_front_g32_base_link:
    x: 0.000
    y: 0.000
    z: 2.700
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  roii_rear_g32_base_link:
    x: 0.000
    y: 0.000
    z: 2.700
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  roii_left_pandar_base_link:
    x: 0.000
    y: 0.000
    z: 2.700
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  roii_right_pandar_base_link:
    x: 0.000
    y: 0.000
    z: 2.700
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

