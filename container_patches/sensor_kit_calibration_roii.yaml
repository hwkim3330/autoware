# CARLA sensor kit calibration (in base_link frame)
# Frames: base_link at rear axle center on ground (x forward, y right, z up).
# Conversion from CARLA vehicle origin ("car center") to base_link:
#   x_base = x_car_center + 1.425  (WB=2.850 m)
#   y_base = y_car_center
#   z_base = z_car_center
#   rpy unchanged

sensor_kit_base_link:
  # Cameras (6 cams, 360°)
  CAM_FRONT/camera_link:
    x: 2.225 # 0.800 + 1.425
    y: 0.000
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  CAM_FRONT_LEFT/camera_link:
    x: 1.695 # 0.270 + 1.425
    y: -0.550
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: -0.959931 # -55 deg

  CAM_FRONT_RIGHT/camera_link:
    x: 1.695 # 0.270 + 1.425
    y: 0.550
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: 0.959931 # +55 deg

  CAM_BACK/camera_link:
    x: -0.575 # -2.000 + 1.425
    y: 0.000
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: 3.141593 # 180 deg

  CAM_BACK_LEFT/camera_link:
    x: 1.105 # -0.320 + 1.425
    y: -0.550
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: -1.919862 # -110 deg

  CAM_BACK_RIGHT/camera_link:
    x: 1.105 # -0.320 + 1.425
    y: 0.550
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: 1.919862 # +110 deg

  # LiDAR (roof)
  velodyne_top_base_link:
    x: 1.035 # -0.390 + 1.425
    y: 0.000
    z: 1.840
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  # GNSS (z = 0 aligns with the IMU/GNSS script assumption; adjust z to move it onto the roof)
  gnss_link:
    x: 0.025 # -1.400 + 1.425
    y: 0.000
    z: 0.000
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  # IMU (same placement rationale as GNSS)
  tamagawa/imu_link:
    x: 0.025 # -1.400 + 1.425
    y: 0.000
    z: 0.000
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  # ===== ROii 4-LiDAR experimental mounts (PLACEHOLDER values, not CAD) =====
  roii_front_g32_base_link:
    x: 2.150
    y: 0.000
    z: 1.100
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  roii_rear_g32_base_link:
    x: -2.150
    y: 0.000
    z: 1.100
    roll: 0.000
    pitch: 0.000
    yaw: 3.141593

  # NOTE (fixed): left/right were swapped -- verified against CARLA's own
  # get_right_vector()/get_forward_vector() on the live actor. Positive y in
  # this frame IS the vehicle's right side (matches the header convention and
  # the 6-camera block above), so "left_pandar" must carry NEGATIVE y.
  #
  # Yaw (fixed): official ROii spec (autoa2z.co.kr/ROII) mounts these at the
  # SIDE MIRROR ("차량의 모서리"/vehicle corner), explicitly "측면과 정면 모두를
  # 빈틈없이 감지" (seamlessly senses BOTH side AND front) -> a diagonal
  # front-outward corner mount, not a pure 90 deg side mount. 45 deg (halfway
  # between front=0 and side=90) matches that intent. 360-deg Pandar coverage
  # itself is unaffected (yaw only sets the reference azimuth), but this keeps
  # the model faithful to the real vehicle and any FOV-limited use correct.
  roii_left_pandar_base_link:
    x: 1.600
    y: -1.050
    z: 1.900  # raised from 1.350 -- was inside the cabin silhouette (roof
              # at 2.660), self-occluding rays toward the vehicle's own
              # rear/inboard side. 1.900 clears the body bulk like a real
              # side-mirror/greenhouse mount would.
    roll: 0.000
    pitch: 0.000
    yaw: -0.785398  # -45 deg: front-left corner, facing forward-left

  roii_right_pandar_base_link:
    x: 1.600
    y: 1.050
    z: 1.900
    roll: 0.000
    pitch: 0.000
    yaw: 0.785398  # +45 deg: front-right corner, facing forward-right

