# CARLA sensor kit calibration (in base_link frame)
# Frames: base_link at rear axle center on ground (x forward, y right, z up).
# Conversion from CARLA vehicle origin ("car center") to base_link:
#   x_base = x_car_center + 1.425  (WB=2.850 m)
#   y_base = y_car_center
#   z_base = z_car_center
#   rpy unchanged

sensor_kit_base_link:
  # Cameras (6 cams, 360°)
  CAM_FRONT/camera_link:
    x: 2.225 # 0.800 + 1.425
    y: 0.000
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  CAM_FRONT_LEFT/camera_link:
    x: 1.695 # 0.270 + 1.425
    y: -0.550
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: -0.959931 # -55 deg

  CAM_FRONT_RIGHT/camera_link:
    x: 1.695 # 0.270 + 1.425
    y: 0.550
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: 0.959931 # +55 deg

  CAM_BACK/camera_link:
    x: -0.575 # -2.000 + 1.425
    y: 0.000
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: 3.141593 # 180 deg

  CAM_BACK_LEFT/camera_link:
    x: 1.105 # -0.320 + 1.425
    y: -0.550
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: -1.919862 # -110 deg

  CAM_BACK_RIGHT/camera_link:
    x: 1.105 # -0.320 + 1.425
    y: 0.550
    z: 1.600
    roll: 0.000
    pitch: 0.000
    yaw: 1.919862 # +110 deg

  # LiDAR (roof)
  velodyne_top_base_link:
    x: 1.035 # -0.390 + 1.425
    y: 0.000
    z: 1.840
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  # GNSS (z = 0 aligns with the IMU/GNSS script assumption; adjust z to move it onto the roof)
  gnss_link:
    x: 0.025 # -1.400 + 1.425
    y: 0.000
    z: 0.000
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  # IMU (same placement rationale as GNSS)
  tamagawa/imu_link:
    x: 0.025 # -1.400 + 1.425
    y: 0.000
    z: 0.000
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  # ===== ROii 4-LiDAR experimental mounts (PLACEHOLDER values, not CAD) =====
  roii_front_g32_base_link:
    x: 2.150
    y: 0.000
    z: 1.100
    roll: 0.000
    pitch: 0.000
    yaw: 0.000

  roii_rear_g32_base_link:
    x: -2.150
    y: 0.000
    z: 1.100
    roll: 0.000
    pitch: 0.000
    yaw: 3.141593

  # NOTE (fixed): left/right were swapped -- verified against CARLA's own
  # get_right_vector()/get_forward_vector() on the live actor. Positive y in
  # this frame IS the vehicle's right side (matches the header convention and
  # the 6-camera block above), so "left_pandar" must carry NEGATIVE y.
  #
  # Yaw (fixed again): a "left_pandar" must actually face the vehicle's LEFT
  # (and "right_pandar" the RIGHT) so the naming matches the physical facing
  # -- pure 90 deg side mount, not a 45 deg forward-diagonal. Overlap with
  # front_g32/rear_g32's own FOV is expected and fine (multiple sensors
  # covering the same zone is the real ROii's redundancy design, not a bug).
  # Note: yaw does not change which real-world directions get returns for a
  # 360-deg FOV sensor (confirmed empirically -- same self-occlusion gap
  # measured at both 45 and 90 deg), it only affects which local ray maps to
  # which labeled azimuth -- so this is a naming/semantics fix, coverage-
  # neutral by itself.
  # LEFT/RIGHT were transposed here until 2026-07-27: this file feeds Autoware's
  # TF, which is REP-103 (+y LEFT, yaw +90deg LEFT), but the values had been
  # authored in CARLA's left-handed convention (+y right). "left_pandar" was
  # therefore mounted on the vehicle's right and vice versa. Coverage is
  # unaffected (the pair is symmetric) -- what broke was every per-sensor
  # consumer: a fault injected into left_pandar killed the right side, and the
  # tablet highlighted the mirrored sensor. y and yaw swapped between the two
  # blocks below; nothing else changed. Same root cause fixed in
  # ros/roii_lidar_slicer.py's SLICES for the roof profile.
  roii_left_pandar_base_link:
    x: 1.600
    y: 1.050
    z: 2.600  # raised again from 1.900 -- measured real angular coverage was
              # still only ~90-130deg out of the declared 220deg FOV (self-
              # occlusion by the cabin body, confirmed live on the CARLA
              # actor: horizontal_fov=220 is correctly applied, the shortfall
              # is real occlusion not config). 1.900 was still well under the
              # roofline (2.660); pushing to right at the roofline clears
              # nearly the entire body silhouette, same reasoning as why real
              # AV corner/side lidars sit at or above the greenhouse line.
    roll: 0.000
    pitch: 0.000
    yaw: 1.570796  # +90 deg: pure LEFT side, facing left (REP-103)

  roii_right_pandar_base_link:
    x: 1.600
    y: -1.050
    z: 2.600
    roll: 0.000
    pitch: 0.000
    yaw: -1.570796  # -90 deg: pure RIGHT side, facing right. (Tested yaw=60
                   # as a diagnostic: the gap's start followed to ~60 but its
                   # end stayed fixed at ~115, widening the total gap from
                   # 25deg to 55deg -- confirms a real, mostly yaw-independent
                   # vehicle-relative dead zone near 90-115deg, so 90 is the
                   # best yaw, not a fixable seam.)

