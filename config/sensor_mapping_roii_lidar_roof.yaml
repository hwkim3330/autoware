# ROii sensor mapping -- profile ROOF (single-sensor variant of LOW).
# Sibling of sensor_mapping_roii_lidar_low.yaml (untouched -- separate file,
# not an in-place edit). Interface publishes .../pointcloud_raw; the fault
# injector republishes .../pointcloud_before_sync which the ROii
# concatenation consumes -- same downstream pipeline as the low/mid/high
# profiles, just fed differently upstream (see below).
default_sensor_kit_name: carla_sensor_kit_description
sensor_mappings:
  # The 4 corner lidars below (front_g32/rear_g32/left_pandar/right_pandar,
  # copied from the "low" profile) each self-occlude on the vehicle body for
  # a real ~90-115deg dead zone (CARLA engine limitation, filed upstream as
  # carla-simulator/carla#9804 -- see sensor_kit_calibration_roii.yaml).
  # This profile replaces them with ONE roof-mounted sensor below +
  # ros/roii_lidar_slicer.py, which republishes 4 azimuth-sliced copies onto
  # the exact same 4 topic names these definitions would otherwise produce
  # directly. Left the 4 defined below (but removed from enabled_sensors)
  # purely as parameter/FOV reference for the slicer's SLICES dict -- not
  # spawned as CARLA sensors in this profile.
  roii_roof_lidar_base_link:
    carla_type: sensor.lidar.ray_cast
    id: roof_lidar
    ros_config:
      frame_id: roii_roof_lidar
      topic_base: /sensing/lidar/roof
      topic_suffix: /pointcloud_raw
      frequency_hz: 11
      qos_profile: best_effort
    parameters:
      range: 135
      channels: 64
      points_per_second: 400000  # ~= sum of the 4 corner sensors' old
                                  # point rates, since one sensor now covers
                                  # what 4 used to (with overlap preserved)
      upper_fov: 15.0
      lower_fov: -25.0
      rotation_frequency: 10
      noise_stddev: 0.0
      horizontal_fov: 360.0
  roii_front_g32_base_link:
    carla_type: sensor.lidar.ray_cast
    id: front_g32
    ros_config:
      frame_id: roii_front_g32
      topic_base: /sensing/lidar/front_g32
      topic_suffix: /pointcloud_raw
      frequency_hz: 11
      qos_profile: best_effort
    parameters:
      range: 135
      channels: 32
      points_per_second: 100000
      upper_fov: 5.0
      lower_fov: -5.0
      rotation_frequency: 10
      noise_stddev: 0.0
      horizontal_fov: 135.0
  roii_rear_g32_base_link:
    carla_type: sensor.lidar.ray_cast
    id: rear_g32
    ros_config:
      frame_id: roii_rear_g32
      topic_base: /sensing/lidar/rear_g32
      topic_suffix: /pointcloud_raw
      frequency_hz: 11
      qos_profile: best_effort
    parameters:
      range: 135
      channels: 32
      points_per_second: 100000
      upper_fov: 5.0
      lower_fov: -5.0
      rotation_frequency: 10
      noise_stddev: 0.0
      horizontal_fov: 135.0
  roii_left_pandar_base_link:
    carla_type: sensor.lidar.ray_cast
    id: left_pandar
    ros_config:
      frame_id: roii_left_pandar
      topic_base: /sensing/lidar/left_pandar
      topic_suffix: /pointcloud_raw
      frequency_hz: 11
      qos_profile: best_effort
    parameters:
      range: 110
      channels: 40
      points_per_second: 140000
      upper_fov: 15.0
      lower_fov: -25.0
      rotation_frequency: 10
      noise_stddev: 0.0
      horizontal_fov: 220.0
  roii_right_pandar_base_link:
    carla_type: sensor.lidar.ray_cast
    id: right_pandar
    ros_config:
      frame_id: roii_right_pandar
      topic_base: /sensing/lidar/right_pandar
      topic_suffix: /pointcloud_raw
      frequency_hz: 11
      qos_profile: best_effort
    parameters:
      range: 110
      channels: 40
      points_per_second: 140000
      upper_fov: 15.0
      lower_fov: -25.0
      rotation_frequency: 10
      noise_stddev: 0.0
      horizontal_fov: 220.0
  tamagawa/imu_link:
    carla_type: sensor.other.imu
    id: imu
    ros_config:
      frame_id: tamagawa/imu_link
      topic: /sensing/imu/tamagawa/imu_raw
      frequency_hz: 50
      qos_profile: reliable
    parameters:
      noise_accel_stddev_x: 0.0
      noise_accel_stddev_y: 0.0
      noise_accel_stddev_z: 0.0
      noise_gyro_stddev_x: 0.0
      noise_gyro_stddev_y: 0.0
      noise_gyro_stddev_z: 0.0
  gnss_link:
    carla_type: sensor.other.gnss
    id: gnss
    ros_config:
      frame_id: map
      topic: /sensing/gnss/pose_with_covariance
      frequency_hz: 2
      qos_profile: reliable
    parameters:
      noise_alt_stddev: 0.0
      noise_lat_stddev: 0.0
      noise_lon_stddev: 0.0
      noise_alt_bias: 0.0
      noise_lat_bias: 0.0
      noise_lon_bias: 0.0
    covariance:
      position_variance: 0.01
      orientation_variance: 1.0
normalization:
  strip_suffixes:
  - _base_link
  - _link
  - /camera_link
enabled_sensors:
- roii_roof_lidar_base_link
- tamagawa/imu_link
- gnss_link
