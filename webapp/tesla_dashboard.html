<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autopilot Dashboard</title>
<style>
  :root {
    --bg: #eceef2; --panel: #ffffff; --card: #f4f5f8; --ink: #111317; --ink2: #3a3f48; --muted: #8e939c;
    --hair: rgba(17,19,23,.07); --ap: #3d6be8; --ap-soft: rgba(61,107,232,.12);
    --red: #e5483f; --amber: #f2a51e; --green: #2bb36a; --btn: #eef0f3; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(17,19,23,.06);
  }
  body.dark { --bg: #0d0f12; --panel: #15181d; --card: #1c2027; --ink: #f3f5f8; --ink2: #c9ced6; --muted: #858c97;
    --hair: rgba(255,255,255,.07); --ap: #5a86f3; --ap-soft: rgba(90,134,243,.16); --btn: #232830;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35); }
  body.gold { --bg: #ece2cf; --panel: #fbf7ee; --card: #f3ebdb; --ink: #2a2318; --ink2: #4d4330; --muted: #9b8c6f;
    --hair: rgba(42,35,24,.08); --ap: #b5832c; --ap-soft: rgba(181,131,44,.14); --btn: #ece2cf; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Pretendard", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; }
  .app { display: grid; grid-template-columns: clamp(340px, 26vw, 460px) 1fr; height: 100vh; }

  .left { background: var(--panel); display: flex; flex-direction: column; gap: 14px; padding: 24px 22px 20px;
    border-right: 1px solid var(--hair); z-index: 2; }
  .row { display: flex; align-items: center; }
  .gear { display: flex; gap: 14px; font-weight: 600; font-size: 17px; color: var(--muted); }
  .gear span { opacity: .4; } .gear span.on { color: var(--ink); opacity: 1; }
  .conn { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .conn.ok i { background: var(--green); }
  .speedblock { display: flex; align-items: flex-end; padding: 6px 2px 0; }
  .speed { font-size: 96px; font-weight: 200; line-height: .86; letter-spacing: -4px; font-variant-numeric: tabular-nums; }
  .unit { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .limit { margin-left: auto; text-align: center; }
  .limit .dial { width: 50px; height: 50px; border-radius: 50%; border: 2.5px solid var(--ink); display: grid; place-items: center;
    font-weight: 700; font-size: 17px; }
  .limit .pm { display: flex; gap: 6px; margin-top: 8px; }
  .limit button { width: 28px; height: 26px; padding: 0; font-size: 16px; border-radius: 8px; }

  .card { background: var(--card); border-radius: 18px; padding: 14px 16px; }
  .ap { display: flex; align-items: center; gap: 12px; }
  .ap .icon { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; background: var(--btn); color: var(--muted); }
  .ap.on .icon { background: var(--ap); color: #fff; }
  .ap .t1 { font-size: 15px; font-weight: 600; }
  .ap .t2 { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .nav { display: none; }
  .nav.show { display: block; }
  .nav .dist { font-size: 26px; font-weight: 600; letter-spacing: -.4px; }
  .nav .eta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .bar { height: 4px; border-radius: 2px; background: var(--hair); margin-top: 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ap); border-radius: 2px; transition: width .4s; }

  .vehicle { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 0; }
  .wheel { width: min(170px, 60%); aspect-ratio: 1; color: var(--ink2); }
  .wheel.ap { color: var(--ap); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip { font-size: 12px; color: var(--ink2); background: var(--card); border-radius: 999px; padding: 6px 11px; display: flex; gap: 6px; align-items: center; }
  .chip b { font-weight: 600; color: var(--ink); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }

  .btns { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 8px; }
  button { border: 0; border-radius: 14px; padding: 14px 0; font: 600 15px/1 inherit; cursor: pointer;
    background: var(--btn); color: var(--ink); transition: transform .08s; }
  button.primary { background: var(--ap); color: #fff; }
  button:active { transform: scale(.97); }

  .right { position: relative; overflow: hidden; touch-action: none; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .glass { background: color-mix(in srgb, var(--panel) 86%, transparent); backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4); box-shadow: var(--shadow); border: 1px solid var(--hair); color: var(--ink); }
  .banner { position: absolute; top: 18px; left: 50%; transform: translateX(-50%) translateY(-8px); opacity: 0;
    border-radius: 14px; padding: 10px 16px; font-size: 13.5px; transition: all .25s; pointer-events: none; max-width: 70%; text-align: center; }
  .banner.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .signal { position: absolute; top: 18px; left: 18px; border-radius: 16px; padding: 10px 14px; display: none; align-items: center; gap: 10px; font-size: 13px; }
  .signal.show { display: flex; }
  .signal .lamp { width: 20px; height: 20px; border-radius: 50%; box-shadow: 0 0 14px currentColor; }
  .sheet { position: absolute; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    border-radius: 20px; padding: 10px 10px 10px 18px; display: flex; gap: 10px; align-items: center; transition: all .22s; }
  .sheet.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .sheet .t { font-size: 14px; color: var(--ink2); margin-right: 6px; }
  .sheet button { padding: 11px 18px; }
  .fab { position: absolute; right: 18px; bottom: 50px; display: flex; flex-direction: column; gap: 10px; }
  .fab button { width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 17px; }
  .credit { position: absolute; left: 14px; bottom: 10px; font-size: 10px; color: var(--muted); opacity: .75; }
  .credit a { color: inherit; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 62vh; }
    .left { padding: 14px; gap: 10px; } .vehicle { display: none; } .speed { font-size: 64px; }
  }
</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div class="app">
  <section class="left">
    <div class="row">
      <div class="gear"><span data-g="P">P</span><span data-g="R">R</span><span data-g="N">N</span><span data-g="D">D</span></div>
      <div class="conn" id="conn"><i></i><span>연결 중</span></div>
    </div>
    <div class="speedblock">
      <div><div class="speed" id="speed">0</div><div class="unit">km/h</div></div>
      <div class="limit"><div class="dial" id="setv">40</div>
        <div class="pm"><button id="vminus">−</button><button id="vplus">+</button></div></div>
    </div>
    <div class="card ap" id="ap">
      <div class="icon"><svg width="20" height="20" viewBox="-12 -12 24 24"><circle r="9.5" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M-8.5,1 L-3,2 L-2,7 L2,7 L3,2 L8.5,1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg></div>
      <div><div class="t1" id="apt1">수동 운전</div><div class="t2" id="apt2">오토파일럿 대기</div></div>
    </div>
    <div class="card nav" id="nav">
      <div class="dist" id="navdist">—</div><div class="eta" id="naveta">—</div>
      <div class="bar"><i id="navbar"></i></div>
    </div>
    <div class="vehicle">
      <svg class="wheel" id="wheel" viewBox="-100 -100 200 200" aria-label="steering wheel">
        <circle r="84" fill="none" stroke="currentColor" stroke-width="13"/>
        <path d="M-78,8 L-27,12 L-15,40 L15,40 L27,12 L78,8" fill="none" stroke="currentColor" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>
        <circle r="17" fill="currentColor"/>
        <rect x="-4" y="-99" width="8" height="16" rx="3" fill="var(--ap)"/>
      </svg>
      <div class="chips">
        <div class="chip">조향 <b id="steer">0°</b></div>
        <div class="chip" id="planchip">계획 <b id="plan">—</b></div>
        <div class="chip"><span class="dot" id="locdot"></span>측위 <b id="loc">—</b></div>
      </div>
    </div>
    <div class="btns">
      <button class="primary" id="go">오토파일럿</button>
      <button id="stop">정지</button>
      <button id="reset">리셋</button>
    </div>
  </section>
  <section class="right">
    <canvas id="scene"></canvas>
    <div class="signal glass" id="signal"><span class="lamp" id="lamp"></span><span id="sigtext"></span></div>
    <div class="banner glass" id="banner"></div>
    <div class="fab"><button class="glass" id="theme" title="테마">◐</button><button class="glass" id="recenter" title="현재 위치">◎</button></div>
    <div class="sheet glass" id="sheet"><span class="t">선택한 위치로 이동할까요?</span>
      <button class="primary" id="goHere">이동</button><button id="cancelPin">취소</button></div>
    <div class="credit">Car model: “Ferrari 458 Italia” by <a href="https://sketchfab.com/models/57bf6cc56931426e87494f554df1dab6" target="_blank" rel="noopener">vicent091036</a></div>
  </section>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const WS_URL = new URLSearchParams(location.search).get('ws') || 'ws://127.0.0.1:8765/ws';
const STEER_RATIO = 8;           // must match the wheel bridge
const INTERP_DELAY = 0.12;       // s: render this far in the past and interpolate the 20 Hz poses
const $ = id => document.getElementById(id);
const S = { ego: null, polys: [], route: [], traj: [], op: '', routeState: '', upcoming: null, lights: [] };
let ws, lastKmh = 0;
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

let setKmh = 40;
function setSpeed(k) { setKmh = Math.max(10, Math.min(60, k)); $('setv').textContent = setKmh; send({ cmd: 'maxvel', kmh: setKmh }); }
$('vminus').onclick = () => setSpeed(setKmh - 5);
$('vplus').onclick = () => setSpeed(setKmh + 5);
$('go').onclick = () => send({ cmd: 'drive' });
$('stop').onclick = () => send({ cmd: 'stop' });
$('reset').onclick = () => { clearPin(); send({ cmd: 'respawn' }); };

// 20 Hz poses with their arrival time; the renderer interpolates between the pair that
// brackets (now - INTERP_DELAY). Easing toward the 2 Hz frame pose made the car surge and stall.
const poses = [];
function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { $('conn').classList.add('ok'); $('conn').lastChild.textContent = '연결됨'; };
  ws.onclose = () => { $('conn').classList.remove('ok'); $('conn').lastChild.textContent = '재연결 중'; setTimeout(connect, 1500); };
  ws.onmessage = ev => {
    let d; try { d = JSON.parse(ev.data); } catch { return; }
    if (d.type === 'lanes') { S.polys = d.polys || []; buildRoads(); return; }
    if (d.type === 'steer') { onSteer(d); return; }
    if (!d.ego) return;
    S.ego = d.ego; S.op = (d.operationMode || {}).mode || '';
    const r = d.route || {};
    S.route = r.routePath || []; S.traj = r.trajPath || []; S.routeState = r.state || '';
    S.upcoming = d.upcomingLight; S.lights = d.trafficLights || [];
    onFrame(d);
  };
}
function onSteer(d) {
  if (d.kmh != null) { lastKmh = Math.abs(d.kmh); $('speed').textContent = Math.round(lastKmh); }
  const deg = d.cmdDeg != null ? d.cmdDeg : (d.actDeg || 0);
  $('steer').textContent = deg.toFixed(1) + '°';
  $('wheel').style.transform = `rotate(${-deg * STEER_RATIO}deg)`;       // + = left
  if (d.x != null && (d.x || d.y)) {
    poses.push({ t: performance.now() / 1000, x: d.x, y: d.y, yaw: d.yawDeg * Math.PI / 180 });
    while (poses.length > 40) poses.shift();
  }
}
const ROUTE_ACTIVE = () => S.routeState === 'SET' || S.routeState === 'CHANGING';
function onFrame(d) {
  const ap = S.op === 'AUTONOMOUS';
  $('ap').classList.toggle('on', ap);
  $('wheel').classList.toggle('ap', ap);
  $('apt1').textContent = ap ? '오토파일럿' : S.op === 'STOP' ? '정지' : '수동 운전';
  $('apt2').textContent = ap ? (ROUTE_ACTIVE() ? '목적지까지 자율주행 중' : '주행 중') :
                          S.op === 'STOP' ? '오토파일럿을 누르거나 지도에서 목적지를 고르세요' : '페달과 핸들로 직접 운전 중';
  // the plan only means something while autonomous on a route -- hide it otherwise
  $('planchip').style.display = ap && ROUTE_ACTIVE() ? '' : 'none';
  $('plan').textContent = Math.round((d.vehicle || {}).plannedKmh || 0) + ' km/h';
  const conv = (d.localization || {}).converged;
  $('loc').textContent = conv ? '정상' : '대기';
  $('locdot').style.background = conv ? 'var(--green)' : 'var(--amber)';
  const kmh = d.ego.speedKmh || 0;
  const gear = kmh < -0.5 ? 'R' : (ap || Math.abs(kmh) > 0.5 ? 'D' : 'P');
  document.querySelectorAll('.gear span').forEach(s => s.classList.toggle('on', s.dataset.g === gear));
  const ul = S.upcoming;
  if (ul && ul.color) {
    const c = ul.color === 1 ? 'var(--red)' : ul.color === 2 ? 'var(--amber)' : 'var(--green)';
    $('lamp').style.background = c; $('lamp').style.color = c;
    $('sigtext').textContent = `${ul.color === 1 ? '정지 신호' : ul.color === 2 ? '황색 신호' : '녹색 신호'} · ${ul.dist} m`;
    $('signal').classList.add('show');
  } else $('signal').classList.remove('show');
  if (ROUTE_ACTIVE() && S.route.length > 1) {
    const e = d.ego; let bi = 0, bd = Infinity, total = 0, rem = 0;
    S.route.forEach((p, i) => { const dd = (p[0] - e.x) ** 2 + (p[1] - e.y) ** 2; if (dd < bd) { bd = dd; bi = i; } });
    for (let i = 0; i < S.route.length - 1; i++) {
      const L = Math.hypot(S.route[i + 1][0] - S.route[i][0], S.route[i + 1][1] - S.route[i][1]);
      total += L; if (i >= bi) rem += L;
    }
    const eta = rem / (Math.max(lastKmh, 20) / 3.6);
    $('navdist').textContent = rem >= 1000 ? (rem / 1000).toFixed(1) + ' km' : Math.round(rem) + ' m';
    $('naveta').textContent = `도착까지 약 ${Math.max(1, Math.round(eta / 60))}분`;
    $('navbar').style.width = (total ? 100 * (1 - rem / total) : 0).toFixed(1) + '%';
    $('nav').classList.add('show');
  } else if (S.routeState === 'ARRIVED') {
    $('navdist').textContent = '도착했습니다'; $('naveta').textContent = '지도에서 다음 목적지를 고르세요';
    $('navbar').style.width = '100%'; $('nav').classList.add('show'); clearPin();
  } else $('nav').classList.remove('show');
  const msg = d.cmdResult || '';
  if (msg && msg !== onFrame.last && !/^AUTONOMOUS$/.test(msg) && !/manual teleop active/.test(msg)) {
    $('banner').textContent = msg; $('banner').classList.add('show'); clearTimeout(onFrame.bt);
    onFrame.bt = setTimeout(() => $('banner').classList.remove('show'), 3500);
  }
  onFrame.last = msg;
  updateDynamic();
}

// ---------------- 3D scene ----------------
// map x -> scene x, map y -> scene -z, up = y; offset by ORIGIN for float32 precision.
let ORIGIN = null;
const W2S = (x, y, h = 0) => new THREE.Vector3(x - ORIGIN[0], h, -(y - ORIGIN[1]));
const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);              // a 4K window at 1.25x blew the frame budget
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
// No tone mapping: under ACES the fogged ground stopped matching the untouched background
// colour and a hard band showed at the horizon.
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.background = new THREE.Color(); scene.fog = new THREE.Fog(0xffffff, 90, 330);
const camera = new THREE.PerspectiveCamera(48, 1, 0.5, 2000);
const hemi = new THREE.HemisphereLight(0xffffff, 0xdddddd, 1.0); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.castShadow = true; sun.shadow.mapSize.set(512, 512);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 60 });
scene.add(sun, sun.target);
const groundMat = new THREE.MeshLambertMaterial();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), groundMat);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
function resize() { const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const THEMES = {
  light: { bg: 0xeceef2, ground: 0xdcdfe5, road: 0xfdfdfe, mark: 0xa9afb9, route: 0x3d6be8, paint: 0xf5f6f8 },
  dark:  { bg: 0x0d0f12, ground: 0x13161b, road: 0x252930, mark: 0x5d6470, route: 0x5a86f3, paint: 0xe8eaee },
  gold:  { bg: 0xece2cf, ground: 0xe1d4ba, road: 0xf8f2e6, mark: 0xb8a473, route: 0xb5832c, paint: 0xc8a15c },
};

function strip(pts, half, off, y, pos, idx) {
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    const nx = -dy, ny = dx, p = pts[i], base = pos.length / 3;
    const cx = p[0] + nx * off, cy = p[1] + ny * off;
    pos.push(cx + nx * half - ORIGIN[0], y, -(cy + ny * half - ORIGIN[1]), cx - nx * half - ORIGIN[0], y, -(cy - ny * half - ORIGIN[1]));
    if (i > 0) idx.push(base - 2, base - 1, base, base - 1, base + 1, base);
  }
}
function thin(pts, minD = 0.6) {
  const out = []; for (const p of pts) { const q = out[out.length - 1]; if (!q || Math.hypot(p[0] - q[0], p[1] - q[1]) >= minD) out.push(p); }
  return out;
}
function meshFrom(pos, idx, mat, order = 0) {
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  // flat ground ribbons: every normal is straight up (computeVertexNormals would follow
  // the winding and leave half the strips facing down -- black under Lambert)
  const n = new Float32Array(pos.length); for (let i = 1; i < n.length; i += 3) n[i] = 1;
  g.setAttribute('normal', new THREE.BufferAttribute(n, 3));
  const m = new THREE.Mesh(g, mat); m.renderOrder = order; return m;
}
const roadMat = new THREE.MeshLambertMaterial({ side: THREE.DoubleSide });
const markMat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
let roadMesh = null, markMesh = null;
function buildRoads() {
  if (!ORIGIN || !S.polys.length) return;
  for (const m of [roadMesh, markMesh]) if (m) { scene.remove(m); m.geometry.dispose(); }
  const rp = [], ri = [], mp = [], mi = [];
  for (const raw of S.polys) {
    const pl = thin(raw, 0.8); if (pl.length < 2) continue;
    strip(pl, 1.8, 0, 0.02, rp, ri);
    // dashed lane marking on the left edge as real 15 cm paint (WebGL lines are 1 px wide)
    let acc = 0, seg = [];
    for (let i = 1; i < pl.length; i++) {
      const a = pl[i - 1], b = pl[i], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
      for (let s = 0; s < L; s += 0.75) {
        const p = [a[0] + (b[0] - a[0]) * s / L, a[1] + (b[1] - a[1]) * s / L];
        if ((acc + s) % 9 < 4.5) seg.push(p); else { if (seg.length > 1) strip(seg, 0.075, 1.75, 0.04, mp, mi); seg = []; }
      }
      acc += L;
    }
    if (seg.length > 1) strip(seg, 0.075, 1.75, 0.04, mp, mi);
  }
  roadMesh = meshFrom(rp, ri, roadMat); roadMesh.receiveShadow = true;
  markMesh = meshFrom(mp, mi, markMat, 1);
  scene.add(roadMesh, markMesh);
}

const routeMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.22, depthWrite: false });
const trajMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.85, depthWrite: false });
let routeMesh = null, trajMesh = null, lastRouteKey = '';
function ribbonMesh(pts, half, y, mat, order) {
