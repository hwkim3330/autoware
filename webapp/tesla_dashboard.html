<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autopilot Dashboard</title>
<style>
  :root {
    --bg: #eef0f3; --panel: #ffffff; --ink: #15171c; --muted: #8b9099; --line: #e4e6ea;
    --ap: #3e6ae1; --red: #e0443e; --amber: #f0a020; --green: #2fb36b; --chip: #f1f3f6; --btn: #eef0f3;
  }
  /* dark: night-mode Model 3 */
  body.dark { --bg: #0f1114; --panel: #16191e; --ink: #f2f4f7; --muted: #8a919c; --line: #23272e;
    --chip: #1e2228; --btn: #23272e; --ap: #4c7bf0; }
  /* gold: Cybercab-style warm gold scene */
  body.gold { --bg: #efe6d4; --panel: #fbf7ef; --ink: #2b2418; --muted: #9a8b70; --line: #e6dbc6;
    --chip: #f3ead9; --btn: #ece2cf; --ap: #b8862f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Pretendard", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden; }
  .app { display: grid; grid-template-columns: minmax(330px, 27%) 1fr; height: 100vh; }
  .left { background: var(--panel); display: flex; flex-direction: column; padding: 26px 26px 20px; gap: 16px;
    box-shadow: 6px 0 30px rgba(20, 24, 33, .05); z-index: 2; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .gear { display: flex; gap: 12px; font-weight: 600; font-size: 18px; color: #cdd0d6; letter-spacing: .5px; }
  .gear span.on { color: var(--ink); }
  .light { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .light .lamp { width: 16px; height: 16px; border-radius: 50%; background: #dcdfe4; transition: background .3s; }
  .speedrow { display: flex; align-items: flex-end; }
  .speed { font-size: 104px; font-weight: 250; line-height: .9; letter-spacing: -5px; font-variant-numeric: tabular-nums; }
  .unit { color: var(--muted); font-size: 15px; margin: 6px 0 0 4px; }
  .setspd { margin-left: auto; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .setspd .val { width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--ink); display: flex;
    align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
  .setspd .row { display: flex; gap: 6px; }
  .setspd button { padding: 3px 11px; font-size: 17px; border-radius: 9px; }
  .ap { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); }
  .ap.on { color: var(--ap); }
  .ap svg { width: 22px; height: 22px; }
  .nav { background: var(--chip); border-radius: 16px; padding: 14px 16px; display: none; }
  .nav.show { display: block; }
  .nav .dist { font-size: 28px; font-weight: 600; letter-spacing: -.5px; }
  .nav .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .spacer { flex: 1; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
  .stats b { color: var(--ink); font-weight: 600; }
  .btns { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
  button { border: 0; border-radius: 13px; padding: 14px 0; font-size: 15px; font-weight: 600;
    cursor: pointer; background: var(--btn); color: var(--ink); font-family: inherit; transition: transform .08s; }
  button.primary { background: var(--ap); color: #fff; }
  button:active { transform: scale(0.97); }
  .right { position: relative; overflow: hidden; touch-action: none; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .banner { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); background: var(--panel); color: var(--ink);
    backdrop-filter: blur(8px); border-radius: 14px; padding: 10px 18px; box-shadow: 0 6px 22px rgba(0,0,0,.08);
    font-size: 14px; display: none; max-width: 80%; text-align: center; }
  .banner.show { display: block; }
  .sheet { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--panel);
    backdrop-filter: blur(8px); border-radius: 18px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.14);
    display: none; gap: 10px; align-items: center; }
  .sheet.show { display: flex; }
  .sheet .t { font-size: 14px; color: var(--muted); padding: 0 8px; }
  .sheet button { padding: 11px 20px; }
  .fab { position: absolute; right: 18px; bottom: 56px; display: flex; flex-direction: column; gap: 10px; }
  .fab button { width: 46px; height: 46px; padding: 0; border-radius: 50%; background: var(--panel); color: var(--ink);
    box-shadow: 0 4px 14px rgba(0,0,0,.12); font-size: 18px; }
  .conn { position: absolute; right: 18px; bottom: 18px; font-size: 12px; color: var(--muted); }
  .credit { position: absolute; left: 14px; bottom: 12px; font-size: 10.5px; color: var(--muted); opacity: .8; }
  .credit a { color: inherit; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 60vh; }
    .left { padding: 14px; gap: 10px; }
    .speed { font-size: 72px; }
  }
</style>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div class="app">
  <section class="left">
    <div class="top">
      <div class="gear"><span data-g="P">P</span><span data-g="R">R</span><span data-g="N">N</span><span data-g="D">D</span></div>
      <div class="light"><span class="lamp" id="lamp"></span><span id="lighttext"></span></div>
    </div>
    <div class="speedrow">
      <div><div class="speed" id="speed">0</div><div class="unit">km/h</div></div>

        <div class="val" id="setv">40</div>
        <div class="row"><button id="vminus">−</button><button id="vplus">+</button></div>
      </div>
    </div>
    <div class="ap" id="ap">
      <svg viewBox="-12 -12 24 24"><circle r="10" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M-9,1 L-3,2 L-2,7 L2,7 L3,2 L9,1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
      <span id="aptext">수동 운전</span></div>
    <div class="nav" id="nav"><div class="dist" id="navdist">—</div><div class="sub" id="navsub">—</div></div>
    <div class="spacer"></div>
    <div class="stats">

    </div>
    <div class="btns">
      <button class="primary" id="go">오토파일럿</button>
      <button id="stop">정지</button>
      <button id="reset">리셋</button>
    </div>
  </section>
  <section class="right">
    <canvas id="scene"></canvas>
    <div class="banner" id="banner"></div>
    <div class="fab"><button id="theme" title="테마">◐</button><button id="recenter" title="현재 위치">◎</button></div>
    <div class="credit">Car: “Ferrari 458 Italia” by <a href="https://sketchfab.com/models/57bf6cc56931426e87494f554df1dab6" target="_blank" rel="noopener">vicent091036</a> (three.js examples)</div>
    <div class="sheet" id="sheet"><span class="t">선택한 위치</span>
      <button class="primary" id="goHere">여기로 이동</button><button id="cancelPin">취소</button></div>
    <div class="conn" id="conn">연결 중…</div>
  </section>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const WS_URL = new URLSearchParams(location.search).get('ws') || 'ws://127.0.0.1:8765/ws';
const STEER_RATIO = 8;   // must match the wheel bridge
const $ = id => document.getElementById(id);
const S = { ego: null, polys: [], route: [], traj: [], op: '', routeState: '', lights: [], upcoming: null };
let ws, lastKmh = 0, steerDeg = 0;
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

// ---------------- controls ----------------
let setKmh = 40;
function setSpeed(k) { setKmh = Math.max(10, Math.min(60, k)); $('setv').textContent = setKmh; send({ cmd: 'maxvel', kmh: setKmh }); }
$('vminus').onclick = () => setSpeed(setKmh - 5);
$('vplus').onclick = () => setSpeed(setKmh + 5);
$('go').onclick = () => send({ cmd: 'drive' });
$('stop').onclick = () => send({ cmd: 'stop' });
$('reset').onclick = () => { clearPin(); send({ cmd: 'respawn' }); };

// ---------------- data ----------------
function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { $('conn').textContent = '게이트웨이 연결됨'; };
  ws.onclose = () => { $('conn').textContent = '재연결 중…'; setTimeout(connect, 1500); };
  ws.onmessage = ev => {
    let d; try { d = JSON.parse(ev.data); } catch { return; }
    if (d.type === 'lanes') { S.polys = d.polys || []; buildRoads(); return; }
    if (d.type === 'steer') { onSteer(d); return; }
    if (!d.ego) return;
    S.ego = d.ego; S.op = (d.operationMode || {}).mode || '';
    const r = d.route || {};
    S.route = r.routePath || []; S.traj = r.trajPath || []; S.routeState = r.state || '';
    S.lights = d.trafficLights || []; S.upcoming = d.upcomingLight;
    onFrame(d);
  };
}
function onSteer(d) {   // 20 Hz: speed + commanded steering
  if (d.kmh != null) { lastKmh = Math.abs(d.kmh); $('speed').textContent = Math.round(lastKmh); }
  steerDeg = d.cmdDeg != null ? d.cmdDeg : (d.actDeg || 0);
  $('steer').textContent = steerDeg.toFixed(1) + '°';
}
function onFrame(d) {
  $('plan').textContent = Math.round((d.vehicle || {}).plannedKmh || 0);
  $('loc').textContent = (d.localization || {}).converged ? 'OK' : '대기';
  $('route').textContent = S.routeState || '-';
  const ap = S.op === 'AUTONOMOUS';
  $('ap').classList.toggle('on', ap);
  $('aptext').textContent = ap ? '오토파일럿 주행 중' : (S.op === 'STOP' ? '정지' : '수동 운전');
  const kmh = d.ego.speedKmh || 0;
  const gear = kmh < -0.5 ? 'R' : (ap || Math.abs(kmh) > 0.5 ? 'D' : 'P');
  document.querySelectorAll('.gear span').forEach(s => s.classList.toggle('on', s.dataset.g === gear));
  const ul = S.upcoming;
  if (ul && ul.color) {
    $('lamp').style.background = ul.color === 1 ? 'var(--red)' : ul.color === 2 ? 'var(--amber)' : 'var(--green)';
    $('lighttext').textContent = `${ul.dist} m`;
  } else { $('lamp').style.background = '#dcdfe4'; $('lighttext').textContent = ''; }
  if ((S.routeState === 'SET' || S.routeState === 'CHANGING') && S.route.length > 1) {
    const e = d.ego; let bi = 0, bd = Infinity;
    S.route.forEach((p, i) => { const dd = (p[0] - e.x) ** 2 + (p[1] - e.y) ** 2; if (dd < bd) { bd = dd; bi = i; } });
    let rem = 0;
    for (let i = bi; i < S.route.length - 1; i++) rem += Math.hypot(S.route[i + 1][0] - S.route[i][0], S.route[i + 1][1] - S.route[i][1]);
    const eta = rem / (Math.max(lastKmh, 20) / 3.6);
    $('navdist').textContent = rem >= 1000 ? (rem / 1000).toFixed(1) + ' km' : Math.round(rem) + ' m';
    $('navsub').textContent = `도착까지 약 ${Math.max(1, Math.round(eta / 60))}분`;
    $('nav').classList.add('show');
  } else if (S.routeState === 'ARRIVED') {
    $('navdist').textContent = '도착'; $('navsub').textContent = '목적지에 도착했습니다'; $('nav').classList.add('show'); clearPin();
  } else $('nav').classList.remove('show');
  const msg = d.cmdResult || '';
  const show = msg && !/^AUTONOMOUS$/.test(msg) && !/manual teleop active/.test(msg);
  $('banner').textContent = msg; $('banner').classList.toggle('show', !!show);
  updateDynamic();
}

// ---------------- 3D scene ----------------
// World: map x -> scene x, map y -> scene -z, up = y. Positions are offset by ORIGIN
// (the first ego pose) so float32 keeps centimetre precision at MGRS-sized coordinates.
let ORIGIN = null;
const W2S = (x, y, h = 0) => new THREE.Vector3(x - ORIGIN[0], h, -(y - ORIGIN[1]));

const canvas = $('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.25));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
// soft studio reflections so the paint reads as paint, not flat grey
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
scene.background = new THREE.Color(0xeef0f3);
scene.fog = new THREE.Fog(0xeef0f3, 140, 420);
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 1500);
const hemi = new THREE.HemisphereLight(0xffffff, 0xd9dde3, 1.15); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 1, far: 80 });
scene.add(sun, sun.target);

const THEMES = {
  light: { bg: 0xeef0f3, ground: 0xd6dae0, road: 0xfdfdfe, lane: 0xc3c8cf, route: 0x3e6ae1, paint: 0xf4f5f7, hemi: [0xffffff, 0xd9dde3] },
  dark:  { bg: 0x0f1114, ground: 0x15181d, road: 0x262a31, lane: 0x4a505a, route: 0x4c7bf0, paint: 0xe9ebee, hemi: [0x9aa4b4, 0x0b0d10] },
  gold:  { bg: 0xefe6d4, ground: 0xe4d8bf, road: 0xf7f0e2, lane: 0xc9b894, route: 0xb8862f, paint: 0xc9a25a, hemi: [0xfff6e4, 0xd8c8a6] },
};
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshLambertMaterial({ color: 0xdfe2e7 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// roads: one merged ribbon mesh for every lane centreline + dashed lane edges
let roadMesh = null, laneLines = null;
const roadMat = new THREE.MeshLambertMaterial({ color: 0xfbfbfc, side: THREE.DoubleSide });
const laneMat = new THREE.LineBasicMaterial({ color: 0xc3c8cf });
function ribbon(pts, half, y, pos, idx) {
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    const nx = -dy * half, ny = dx * half, base = pos.length / 3;
    const p = pts[i];
    pos.push(p[0] + nx - ORIGIN[0], y, -(p[1] + ny - ORIGIN[1]), p[0] - nx - ORIGIN[0], y, -(p[1] - ny - ORIGIN[1]));
    if (i > 0) idx.push(base - 2, base - 1, base, base - 1, base + 1, base);
  }
}
function buildRoads() {
  if (!ORIGIN || !S.polys.length) return;
  if (roadMesh) { scene.remove(roadMesh, laneLines); roadMesh.geometry.dispose(); laneLines.geometry.dispose(); }
  const pos = [], idx = [], lp = [];
  for (const pl of S.polys) {
    if (pl.length < 2) continue;
    ribbon(pl, 1.8, 0.02, pos, idx);
    // dashed edge on the left side of each lane
    let acc = 0;
    for (let i = 1; i < pl.length; i++) {
      const a = pl[i - 1], b = pl[i]; let dx = b[0] - a[0], dy = b[1] - a[1]; const L = Math.hypot(dx, dy); if (!L) continue;
      dx /= L; dy /= L; const nx = -dy * 1.75, ny = dx * 1.75;
      for (let s = 0; s < L; s += 0.5) {
        if ((acc + s) % 6 < 3) {
          const x0 = a[0] + dx * s + nx, y0 = a[1] + dy * s + ny, s1 = Math.min(s + 0.5, L);
          lp.push(x0 - ORIGIN[0], 0.04, -(y0 - ORIGIN[1]), a[0] + dx * s1 + nx - ORIGIN[0], 0.04, -(a[1] + dy * s1 + ny - ORIGIN[1]));
        }
      }
      acc += L;
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  roadMesh = new THREE.Mesh(g, roadMat);
  roadMesh.receiveShadow = true;
  const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
  laneLines = new THREE.LineSegments(lg, laneMat);
  scene.add(roadMesh, laneLines);
}

// route + trajectory ribbons, rebuilt when the frame changes
const routeMat = new THREE.MeshBasicMaterial({ color: 0x3e6ae1, transparent: true, opacity: 0.28, depthWrite: false });
const trajMat = new THREE.MeshBasicMaterial({ color: 0x3e6ae1, transparent: true, opacity: 0.9, depthWrite: false });
let routeMesh = null, trajMesh = null, lightGroup = new THREE.Group(); scene.add(lightGroup);
function thin(pts, minD = 0.6) {
  const out = [];
  for (const p of pts) { const q = out[out.length - 1]; if (!q || Math.hypot(p[0] - q[0], p[1] - q[1]) >= minD) out.push(p); }
  return out;
}
function stripMesh(pts, half, y, mat) {
  pts = thin(pts);
  if (pts.length < 2) return null;
  const pos = [], idx = []; ribbon(pts, half, y, pos, idx);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  const m = new THREE.Mesh(g, mat); m.renderOrder = 2; return m;
}
let lastRouteKey = '';
function updateDynamic() {
  if (!ORIGIN) return;
  const rk = S.route.length + ':' + (S.route[0] || []).join(',');
  if (rk !== lastRouteKey) {
    lastRouteKey = rk;
    if (routeMesh) { scene.remove(routeMesh); routeMesh.geometry.dispose(); }
    routeMesh = stripMesh(S.route, 1.6, 0.06, routeMat); if (routeMesh) scene.add(routeMesh);
  }
  if (trajMesh) { scene.remove(trajMesh); trajMesh.geometry.dispose(); }
  trajMesh = stripMesh(S.traj, 0.9, 0.08, trajMat); if (trajMesh) scene.add(trajMesh);
  lightGroup.clear();
  for (const l of S.lights) {
    const col = l.color === 1 ? 0xe0443e : l.color === 2 ? 0xf0a020 : l.color === 3 ? 0x2fb36b : 0xb8bcc4;
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 4.5), new THREE.MeshLambertMaterial({ color: 0x9aa0a8 }));
    pole.position.copy(W2S(l.x, l.y, 2.25));
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 12), new THREE.MeshBasicMaterial({ color: col }));
    bulb.position.copy(W2S(l.x, l.y, 4.8));
    lightGroup.add(pole, bulb);
  }
  routeMesh && (routeMesh.visible = S.routeState === 'SET' || S.routeState === 'CHANGING');
}

// ego car: a stylised white saloon (body extruded from a side profile, glass cabin, wheels)
function makeCar() {
  const car = new THREE.Group();
  const prof = new THREE.Shape();
  prof.moveTo(-2.35, 0.35); prof.lineTo(2.25, 0.35); prof.quadraticCurveTo(2.45, 0.38, 2.42, 0.62);
  prof.lineTo(2.3, 0.82); prof.quadraticCurveTo(1.9, 0.9, 1.1, 0.95); prof.lineTo(-1.9, 0.98);
  prof.quadraticCurveTo(-2.35, 0.95, -2.38, 0.7); prof.closePath();
  const body = new THREE.Mesh(new THREE.ExtrudeGeometry(prof, { depth: 1.86, bevelEnabled: true, bevelSize: 0.08, bevelThickness: 0.08, bevelSegments: 3 }),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35, metalness: 0.1 }));
  body.position.z = -0.93; body.castShadow = true; car.add(body);
  const cab = new THREE.Shape();
  cab.moveTo(-1.55, 0.98); cab.lineTo(1.05, 0.98); cab.quadraticCurveTo(0.55, 1.45, -0.1, 1.48);
  cab.lineTo(-0.9, 1.46); cab.quadraticCurveTo(-1.45, 1.3, -1.55, 0.98);
  const glass = new THREE.Mesh(new THREE.ExtrudeGeometry(cab, { depth: 1.6, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05 }),
    new THREE.MeshStandardMaterial({ color: 0x2a2f38, roughness: 0.15, metalness: 0.4 }));
  glass.position.z = -0.8; glass.castShadow = true; car.add(glass);
  const wheelG = new THREE.CylinderGeometry(0.36, 0.36, 0.26, 24), wheelM = new THREE.MeshStandardMaterial({ color: 0x1d2026, roughness: 0.8 });
  for (const [x, z] of [[1.45, 0.86], [1.45, -0.86], [-1.45, 0.86], [-1.45, -0.86]]) {
    const w = new THREE.Mesh(wheelG, wheelM); w.rotation.x = Math.PI / 2; w.position.set(x, 0.36, z); w.castShadow = true; car.add(w);
  }
  return car;
}
const car = new THREE.Group(); scene.add(car);
const fallbackCar = makeCar(); car.add(fallbackCar);
const paintMat = new THREE.MeshPhysicalMaterial({ color: 0xf4f5f7, metalness: 0.15, roughness: 0.25, clearcoat: 1.0, clearcoatRoughness: 0.03 });
{
  const draco = new DRACOLoader(); draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/');
  const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
  loader.load('https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/models/gltf/ferrari.glb', gltf => {
    const m = gltf.scene.children[0];
    const body = m.getObjectByName('body'); if (body) body.material = paintMat;
    const glass = m.getObjectByName('glass');
    if (glass) glass.material = new THREE.MeshPhysicalMaterial({ color: 0x1b1f26, metalness: 0.25, roughness: 0, transmission: 0.2, transparent: true, opacity: 0.85 });
    for (const n of ['rim_fl', 'rim_fr', 'rim_rr', 'rim_rl', 'trim'])
      { const o = m.getObjectByName(n); if (o) o.material = new THREE.MeshStandardMaterial({ color: 0xbfc4cc, metalness: 1, roughness: 0.4 }); }
    m.traverse(o => { if (o.isMesh) o.castShadow = true; });
    // fit: 4.7 m long, nose along +x (our car frame), wheels on the ground
    const box = new THREE.Box3().setFromObject(m), size = box.getSize(new THREE.Vector3());
    const holder = new THREE.Group(); holder.add(m);
    if (size.z > size.x) holder.rotation.y = -Math.PI / 2;     // model is built along z, nose to -z
    const s = 4.7 / Math.max(size.x, size.z); holder.scale.setScalar(s);
    const b2 = new THREE.Box3().setFromObject(holder); holder.position.y -= b2.min.y;
    car.remove(fallbackCar); car.add(holder);
  }, undefined, () => { /* offline: keep the procedural car */ });
}
const carAp = new THREE.Mesh(new THREE.RingGeometry(2.9, 3.15, 48), new THREE.MeshBasicMaterial({ color: 0x3e6ae1, transparent: true, opacity: 0.5 }));
carAp.rotation.x = -Math.PI / 2; carAp.position.y = 0.05; scene.add(carAp);

// destination pin
const pinGroup = new THREE.Group();
{ const head = new THREE.Mesh(new THREE.SphereGeometry(0.9, 24, 16), new THREE.MeshStandardMaterial({ color: 0x3e6ae1 }));
  head.position.y = 3.2; const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.02, 2.6), new THREE.MeshStandardMaterial({ color: 0x3e6ae1 }));
  stick.position.y = 1.4; pinGroup.add(head, stick); pinGroup.visible = false; scene.add(pinGroup); }

// pose easing (frames arrive a few times a second); >30 m jumps snap
const V = { x: 0, y: 0, yaw: 0, init: false };
function easePose() {
  const e = S.ego; if (!e || (!e.x && !e.y)) return;
  if (!ORIGIN) { ORIGIN = [e.x, e.y]; buildRoads(); updateDynamic(); }
  const yaw = (e.yawDeg || 0) * Math.PI / 180;
  if (!V.init || Math.hypot(e.x - V.x, e.y - V.y) > 30) { Object.assign(V, { x: e.x, y: e.y, yaw, init: true }); return; }
  V.x += (e.x - V.x) * 0.2; V.y += (e.y - V.y) * 0.2;
  let d = yaw - V.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); V.yaw += d * 0.2;
}

// camera: chase (behind + above) or free orbit-ish after a drag
const CAM = { follow: true, dist: 16, height: 7, fx: 0, fy: 0, heading: 0, zoom: 1 };
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function updateCamera() {
  if (!ORIGIN) return;
  if (CAM.follow) { CAM.fx = V.x; CAM.fy = V.y; let d = V.yaw - CAM.heading; d = Math.atan2(Math.sin(d), Math.cos(d)); CAM.heading += d * 0.08; }
  const k = 1 + Math.min(lastKmh, 60) / 60 * 0.9;           // pull back with speed
  const dist = CAM.dist * k * CAM.zoom, h = CAM.height * k * CAM.zoom;
  const look = W2S(CAM.fx + Math.cos(CAM.heading) * 8, CAM.fy + Math.sin(CAM.heading) * 8, 0);
  const pos = W2S(CAM.fx - Math.cos(CAM.heading) * dist, CAM.fy - Math.sin(CAM.heading) * dist, h);
  camPos.lerp(pos, camPos.lengthSq() ? 0.15 : 1); camLook.lerp(look, camLook.lengthSq() ? 0.2 : 1);
  camera.position.copy(camPos); camera.lookAt(camLook);
  sun.position.copy(W2S(V.x + 20, V.y + 30, 40)); sun.target.position.copy(W2S(V.x, V.y, 0));
}

// interaction: drag pans the view, click drops a pin, wheel zooms
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let pin = null, drag = null;
function groundAt(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(ground)[0]; if (!hit) return null;
  return [hit.point.x + ORIGIN[0], -hit.point.z + ORIGIN[1]];
}
function clearPin() { pin = null; pinGroup.visible = false; $('sheet').classList.remove('show'); }
$('cancelPin').onclick = clearPin;
$('goHere').onclick = () => { if (!pin) return; send({ cmd: 'goto', x: pin[0], y: pin[1] });
  $('sheet').classList.remove('show'); CAM.follow = true; };
$('recenter').onclick = () => { CAM.follow = true; CAM.zoom = 1; };
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, moved: false, start: groundAt(e) }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!drag || !drag.start) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
  drag.moved = true; CAM.follow = false;
  const now = groundAt(e); if (!now) return;
  CAM.fx += drag.start[0] - now[0]; CAM.fy += drag.start[1] - now[1];
});
canvas.addEventListener('pointerup', e => {
  if (drag && !drag.moved) { const p = groundAt(e); if (p) { pin = p; pinGroup.position.copy(W2S(p[0], p[1], 0)); pinGroup.visible = true; $('sheet').classList.add('show'); } }
  drag = null;
});
canvas.addEventListener('wheel', e => { e.preventDefault(); CAM.zoom = Math.max(0.4, Math.min(5, CAM.zoom * (e.deltaY < 0 ? 0.88 : 1.14))); }, { passive: false });

// destination from the active route when no pin is pending
function routeDest() {
  return (S.routeState === 'SET' || S.routeState === 'CHANGING') && S.route.length > 1 ? S.route[S.route.length - 1] : null;
}

let lastT = 0;
function loop(t) {
  requestAnimationFrame(loop);
  if (t - lastT < 30) return; lastT = t;     // ~33 fps
  easePose();
  if (ORIGIN) {
    car.position.copy(W2S(V.x, V.y, 0)); car.rotation.y = V.yaw;
    carAp.position.set(car.position.x, 0.05, car.position.z); carAp.visible = S.op === 'AUTONOMOUS';
    if (!pin) { const d = routeDest(); pinGroup.visible = !!d; if (d) pinGroup.position.copy(W2S(d[0], d[1], 0)); }
    pinGroup.rotation.y += 0.03;
    updateCamera();
  }
  renderer.render(scene, camera);
}
function applyTheme(name) {
  const t = THEMES[name] || THEMES.light;
  document.body.classList.remove('dark', 'gold'); if (name !== 'light') document.body.classList.add(name);
  scene.background.setHex(t.bg); scene.fog.color.setHex(t.bg); ground.material.color.setHex(t.ground);
  roadMat.color.setHex(t.road); laneMat.color.setHex(t.lane);
  routeMat.color.setHex(t.route); trajMat.color.setHex(t.route); carAp.material.color.setHex(t.route);
  paintMat.color.setHex(t.paint); hemi.color.setHex(t.hemi[0]); hemi.groundColor.setHex(t.hemi[1]);
  sun.intensity = name === 'dark' ? 0.9 : 1.4;
  try { localStorage.setItem('dash-theme', name); } catch {}
}
const ORDER = ['light', 'dark', 'gold'];
let theme = new URLSearchParams(location.search).get('theme');
try { theme = theme || localStorage.getItem('dash-theme'); } catch {}
theme = ORDER.includes(theme) ? theme : 'light';
applyTheme(theme);
$('theme').onclick = () => { theme = ORDER[(ORDER.indexOf(theme) + 1) % ORDER.length]; applyTheme(theme); };

connect(); requestAnimationFrame(loop);
</script>
