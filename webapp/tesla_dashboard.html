<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autopilot Dashboard</title>
<style>
  :root {
    --bg: #f2f3f5; --panel: #ffffff; --ink: #16181d; --muted: #8a8f98; --line: #e3e5e9;
    --road: #e3e6ea; --lane: #ffffff; --route: #3e6ae1; --ap: #3e6ae1;
    --red: #e0443e; --amber: #f0a020; --green: #2fb36b; --chip: #eef0f3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Pretendard", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; }
  .app { display: grid; grid-template-columns: minmax(320px, 28%) 1fr; height: 100vh; }
  .left { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column;
    padding: 24px 24px 18px; gap: 14px; overflow: hidden; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .gear { display: flex; gap: 12px; font-weight: 600; font-size: 19px; color: #c9ccd2; }
  .gear span.on { color: var(--ink); }
  .light { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); min-height: 26px; }
  .light .lamp { width: 18px; height: 18px; border-radius: 50%; background: #d7dadf; }
  .speedrow { display: flex; align-items: flex-end; gap: 14px; }
  .speed { font-size: 112px; font-weight: 300; line-height: .95; letter-spacing: -4px; font-variant-numeric: tabular-nums; }
  .unit { color: var(--muted); font-size: 16px; padding-bottom: 12px; }
  .setspd { margin-left: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .setspd .val { width: 54px; height: 54px; border-radius: 50%; border: 3px solid var(--ink); display: flex;
    align-items: center; justify-content: center; font-weight: 700; font-size: 19px; }
  .setspd .row { display: flex; gap: 6px; }
  .setspd button { padding: 2px 10px; font-size: 18px; border-radius: 8px; }
  .ap { display: flex; align-items: center; gap: 10px; font-size: 16px; color: var(--muted); }
  .ap.on { color: var(--ap); }
  .ap .dot { width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
  .wheelbox { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 120px; }
  .wheel { width: min(190px, 62%); aspect-ratio: 1; }
  .wheel.ap circle.rim { stroke: var(--ap); }
  .nav { background: var(--chip); border-radius: 14px; padding: 12px 14px; display: none; }
  .nav.show { display: block; }
  .nav .dist { font-size: 26px; font-weight: 600; }
  .nav .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; font-size: 13px; color: var(--muted); }
  .stats b { color: var(--ink); font-weight: 600; }
  .btns { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
  button { border: 0; border-radius: 12px; padding: 13px 0; font-size: 15px; font-weight: 600;
    cursor: pointer; background: #eceef1; color: var(--ink); font-family: inherit; }
  button.primary { background: var(--ap); color: #fff; }
  button:active { transform: scale(0.97); }
  .right { position: relative; overflow: hidden; touch-action: none; }
  canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
  .banner { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); background: var(--panel);
    border-radius: 14px; padding: 10px 18px; box-shadow: 0 4px 18px rgba(0,0,0,.08); font-size: 14px;
    display: none; max-width: 80%; text-align: center; }
  .banner.show { display: block; }
  .sheet { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--panel);
    border-radius: 16px; padding: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.14); display: none; gap: 10px;
    align-items: center; }
  .sheet.show { display: flex; }
  .sheet .t { font-size: 14px; color: var(--muted); padding: 0 6px; }
  .sheet button { padding: 11px 18px; }
  .fab { position: absolute; right: 16px; bottom: 54px; display: flex; flex-direction: column; gap: 8px; }
  .fab button { width: 46px; height: 46px; padding: 0; border-radius: 50%; background: var(--panel);
    box-shadow: 0 3px 12px rgba(0,0,0,.12); font-size: 20px; }
  .conn { position: absolute; right: 16px; bottom: 16px; font-size: 12px; color: var(--muted); }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 58vh; }
    .left { border-right: 0; border-bottom: 1px solid var(--line); padding: 14px; }
    .speed { font-size: 76px; }
    .wheelbox { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <section class="left">
    <div class="top">
      <div class="gear"><span data-g="P">P</span><span data-g="R">R</span><span data-g="N">N</span><span data-g="D">D</span></div>
      <div class="light"><span class="lamp" id="lamp"></span><span id="lighttext"></span></div>
    </div>
    <div class="speedrow">
      <div><div class="speed" id="speed">0</div><div class="unit">km/h</div></div>
      <div class="setspd">
        <div class="val" id="setv">40</div>
        <div class="row"><button id="vminus">−</button><button id="vplus">+</button></div>
      </div>
    </div>
    <div class="ap" id="ap"><span class="dot"></span><span id="aptext">수동 운전</span></div>
    <div class="nav" id="nav">
      <div class="dist" id="navdist">—</div>
      <div class="sub" id="navsub">—</div>
    </div>
    <div class="wheelbox">
      <svg class="wheel" id="wheel" viewBox="-100 -100 200 200" aria-label="steering wheel">
        <circle class="rim" r="86" fill="none" stroke="#16181d" stroke-width="14"/>
        <path d="M-80,6 L-28,10 L-16,40 L16,40 L28,10 L80,6" fill="none" stroke="#16181d" stroke-width="12" stroke-linejoin="round"/>
        <circle r="18" fill="#16181d"/>
        <rect x="-4" y="-100" width="8" height="18" rx="3" fill="#3e6ae1"/>
      </svg>
    </div>
    <div class="stats">
      <div>조향 <b id="steer">0°</b></div>
      <div>계획 속도 <b id="plan">0</b></div>
      <div>측위 <b id="loc">-</b></div>
      <div>경로 <b id="route">-</b></div>
    </div>
    <div class="btns">
      <button class="primary" id="go">오토파일럿</button>
      <button id="stop">정지</button>
      <button id="reset">리셋</button>
    </div>
  </section>
  <section class="right">
    <canvas id="map"></canvas>
    <div class="banner" id="banner"></div>
    <div class="fab"><button id="recenter" title="현재 위치">◎</button></div>
    <div class="sheet" id="sheet"><span class="t">지도에서 고른 위치</span>
      <button class="primary" id="goHere">여기로 이동</button><button id="cancelPin">취소</button></div>
    <div class="conn" id="conn">연결 중…</div>
  </section>
</div>
<script>
const WS_URL = new URLSearchParams(location.search).get('ws') || 'ws://127.0.0.1:8765/ws';
const STEER_RATIO = 8;   // must match the wheel bridge
const S = { ego: null, polys: [], route: [], traj: [], op: '', routeState: '', lights: [], upcoming: null };
const $ = id => document.getElementById(id);
let ws;
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

// ---------- controls ----------
let setKmh = 40;
function setSpeed(k) { setKmh = Math.max(10, Math.min(60, k)); $('setv').textContent = setKmh; send({ cmd: 'maxvel', kmh: setKmh }); }
$('vminus').onclick = () => setSpeed(setKmh - 5);
$('vplus').onclick = () => setSpeed(setKmh + 5);
$('go').onclick = () => send({ cmd: 'drive' });
$('stop').onclick = () => send({ cmd: 'stop' });
$('reset').onclick = () => { clearPin(); send({ cmd: 'respawn' }); };

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { $('conn').textContent = '게이트웨이 연결됨'; };
  ws.onclose = () => { $('conn').textContent = '재연결 중…'; setTimeout(connect, 1500); };
  ws.onmessage = (ev) => {
    let d; try { d = JSON.parse(ev.data); } catch { return; }
    if (d.type === 'lanes') { S.polys = d.polys || []; return; }
    if (d.type === 'steer') { onSteer(d); return; }
    if (!d.ego) return;
    S.ego = d.ego; S.op = (d.operationMode || {}).mode || '';
    const r = d.route || {};
    S.route = r.routePath || []; S.traj = r.trajPath || []; S.routeState = r.state || '';
    S.lights = d.trafficLights || []; S.upcoming = d.upcomingLight;
    onFrame(d);
  };
}

// 20 Hz stream: speed + commanded steering, so the gauge and wheel move with the car
let lastKmh = 0;
function onSteer(d) {
  if (d.kmh != null) { lastKmh = Math.abs(d.kmh); $('speed').textContent = Math.round(lastKmh); }
  const deg = d.cmdDeg != null ? d.cmdDeg : (d.actDeg || 0);
  $('steer').textContent = deg.toFixed(1) + '°';
  $('wheel').style.transform = `rotate(${-deg * STEER_RATIO}deg)`;   // + = left -> counter-clockwise
}

function onFrame(d) {
  const v = d.vehicle || {};
  $('plan').textContent = Math.round(v.plannedKmh || 0);
  $('loc').textContent = (d.localization || {}).converged ? 'OK' : '대기';
  $('route').textContent = S.routeState || '-';
  const ap = S.op === 'AUTONOMOUS';
  $('ap').classList.toggle('on', ap);
  $('wheel').classList.toggle('ap', ap);
  $('aptext').textContent = ap ? '오토파일럿 주행 중' : (S.op === 'STOP' ? '정지' : '수동 운전');
  const kmh = d.ego.speedKmh || 0;
  const gear = kmh < -0.5 ? 'R' : (ap || Math.abs(kmh) > 0.5 ? 'D' : 'P');
  document.querySelectorAll('.gear span').forEach(s => s.classList.toggle('on', s.dataset.g === gear));
  // upcoming light (colour read from AWSIM's traffic-light camera by the gateway)
  const ul = S.upcoming;
  if (ul && ul.color) {
    $('lamp').style.background = ul.color === 1 ? 'var(--red)' : ul.color === 2 ? 'var(--amber)' : 'var(--green)';
    $('lighttext').textContent = `${ul.dist} m`;
  } else { $('lamp').style.background = '#d7dadf'; $('lighttext').textContent = ''; }
  // navigation card: remaining distance along the route from the nearest route point
  if ((S.routeState === 'SET' || S.routeState === 'CHANGING') && S.route.length > 1) {
    const e = d.ego; let bi = 0, bd = Infinity;
    for (let i = 0; i < S.route.length; i++) {
      const p = S.route[i], dd = (p[0] - e.x) ** 2 + (p[1] - e.y) ** 2;
      if (dd < bd) { bd = dd; bi = i; }
    }
    let rem = 0;
    for (let i = bi; i < S.route.length - 1; i++) rem += Math.hypot(S.route[i + 1][0] - S.route[i][0], S.route[i + 1][1] - S.route[i][1]);
    const eta = rem / (Math.max(lastKmh, 20) / 3.6);
    $('navdist').textContent = rem >= 1000 ? (rem / 1000).toFixed(1) + ' km' : Math.round(rem) + ' m';
    $('navsub').textContent = `도착까지 약 ${Math.max(1, Math.round(eta / 60))}분`;
    $('nav').classList.add('show');
  } else if (S.routeState === 'ARRIVED') {
    $('navdist').textContent = '도착'; $('navsub').textContent = '목적지에 도착했습니다';
    $('nav').classList.add('show'); clearPin();
  } else { $('nav').classList.remove('show'); }
  const msg = d.cmdResult || '';
  const show = msg && !/^AUTONOMOUS$/.test(msg) && !/manual teleop active/.test(msg);
  $('banner').textContent = msg; $('banner').classList.toggle('show', !!show);
}

// ---------- map ----------
const cv = $('map'), cx = cv.getContext('2d');
// Render at 1x even on a 4K/HiDPI screen: at devicePixelRatio 2 the full-window canvas
// was 4x the pixels and every frame redrew every lane in the map -- the dashboard crawled.
function resize() { const r = cv.getBoundingClientRect(); cv.width = r.width; cv.height = r.height; }
addEventListener('resize', resize); resize();
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { bg: css('--bg'), road: css('--road'), lane: css('--lane'), route: css('--route'), ink: css('--ink'),
              red: css('--red'), amber: css('--amber'), green: css('--green') };

// View: follow mode (heading-up on the car) or free mode after the user drags.
const VIEW = { follow: true, x: 0, y: 0, rot: 0, zoom: 6, userZoom: 1 };
// The gateway sends a few frames a second, so drawing the raw pose made the map jump.
// V eases toward the latest pose every draw; a jump of more than 30 m (teleport/re-init)
// snaps instead of sliding across the city.
const V = { x: 0, y: 0, yaw: 0, init: false };
function easePose() {
  const e = S.ego; if (!e || (!e.x && !e.y)) return;
  const yaw = (e.yawDeg || 0) * Math.PI / 180;
  if (!V.init || Math.hypot(e.x - V.x, e.y - V.y) > 30) { V.x = e.x; V.y = e.y; V.yaw = yaw; V.init = true; return; }
  const k = 0.25;
  V.x += (e.x - V.x) * k; V.y += (e.y - V.y) * k;
  let d = yaw - V.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); V.yaw += d * k;
}
// Only lanes near the view centre are drawn; refreshed twice a second, not per frame.
let nearPolys = [];
setInterval(() => {
  const R = 420 / Math.max(0.5, VIEW.userZoom);
  nearPolys = S.polys.filter(pl => pl.some(p => Math.abs(p[0] - VIEW.x) < R && Math.abs(p[1] - VIEW.y) < R));
}, 500);

// screen <-> world for the current view
function anchor() { return { ax: cv.width / 2, ay: VIEW.follow ? cv.height * 0.68 : cv.height / 2 }; }
function toWorld(sx, sy) {
  const { ax, ay } = anchor();
  const dx = (sx - ax) / VIEW.zoom, dy = -(sy - ay) / VIEW.zoom;
  const c = Math.cos(-VIEW.rot), s = Math.sin(-VIEW.rot);
  return [VIEW.x + dx * c - dy * s, VIEW.y + dx * s + dy * c];
}

let pin = null;
function clearPin() { pin = null; $('sheet').classList.remove('show'); }
$('cancelPin').onclick = clearPin;
$('goHere').onclick = () => {
  if (!pin) return;
  send({ cmd: 'goto', x: pin[0], y: pin[1] });
  pin = null; $('sheet').classList.remove('show');
  VIEW.follow = true;
};
$('recenter').onclick = () => { VIEW.follow = true; VIEW.userZoom = 1; };

// pointer: drag pans (switches to free view), a click without movement drops a pin
let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.offsetX, y: e.offsetY, moved: false, vx: VIEW.x, vy: VIEW.y }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.offsetX - drag.x, dy = e.offsetY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;
  if (!drag.moved && VIEW.follow) { drag.vx = VIEW.x; drag.vy = VIEW.y; }
  drag.moved = true; VIEW.follow = false;
  const c = Math.cos(-VIEW.rot), s = Math.sin(-VIEW.rot);
  const wx = -dx / VIEW.zoom, wy = dy / VIEW.zoom;
  VIEW.x = drag.vx + wx * c - wy * s; VIEW.y = drag.vy + wx * s + wy * c;
});
cv.addEventListener('pointerup', e => {
  if (drag && !drag.moved) { pin = toWorld(e.offsetX, e.offsetY); $('sheet').classList.add('show'); }
  drag = null;
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  VIEW.userZoom = Math.max(0.25, Math.min(4, VIEW.userZoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
}, { passive: false });

let lastDraw = 0;
function draw(t) {
  requestAnimationFrame(draw);
  if (t - lastDraw < 33) return;          // ~30 fps is plenty for a map
  lastDraw = t;
  const W = cv.width, H = cv.height;
  cx.fillStyle = COL.bg; cx.fillRect(0, 0, W, H);
  if (!S.ego) return;
  easePose();
  const base = (H / 760) * (8.0 - Math.min(lastKmh, 60) / 60 * 4.0);   // zoom out with speed
  VIEW.zoom += (base * VIEW.userZoom - VIEW.zoom) * 0.08;
  if (VIEW.follow) {
    VIEW.x = V.x; VIEW.y = V.y;
    let d = (Math.PI / 2 - V.yaw) - VIEW.rot; d = Math.atan2(Math.sin(d), Math.cos(d));
    VIEW.rot += d * 0.2;                  // heading up, eased
  }
  const { ax, ay } = anchor();
  cx.save();
  cx.translate(ax, ay);
  cx.scale(VIEW.zoom, -VIEW.zoom);        // world y up
  cx.rotate(VIEW.rot);
  cx.translate(-VIEW.x, -VIEW.y);
  const stroke = (lw, col) => {
    cx.strokeStyle = col; cx.lineWidth = lw; cx.lineCap = 'round'; cx.lineJoin = 'round';
    for (const pl of nearPolys) { if (!pl.length) continue;
      cx.beginPath(); cx.moveTo(pl[0][0], pl[0][1]); for (const p of pl) cx.lineTo(p[0], p[1]); cx.stroke(); }
  };
  stroke(3.6, COL.road);
  cx.setLineDash([1.5, 2.5]); stroke(0.15, COL.lane); cx.setLineDash([]);
  const path = (pts, lw, col, alpha) => { if (pts.length < 2) return;
    cx.globalAlpha = alpha; cx.strokeStyle = col; cx.lineWidth = lw; cx.beginPath();
    cx.moveTo(pts[0][0], pts[0][1]); for (const p of pts) cx.lineTo(p[0], p[1]); cx.stroke(); cx.globalAlpha = 1; };
  path(S.route, 1.8, COL.route, 0.35);
  path(S.traj, 1.2, COL.route, 0.95);
  for (const l of S.lights) {
    cx.fillStyle = l.color === 1 ? COL.red : l.color === 2 ? COL.amber : l.color === 3 ? COL.green : '#b8bcc4';
    cx.beginPath(); cx.arc(l.x, l.y, 1.4, 0, Math.PI * 2); cx.fill();
  }
  // destination: the pending pin, else the end of the active route
  const dest = pin || ((S.routeState === 'SET' || S.routeState === 'CHANGING') && S.route.length > 1
                       ? S.route[S.route.length - 1] : null);
  if (dest) {
    cx.save(); cx.translate(dest[0], dest[1]); cx.rotate(-VIEW.rot); cx.scale(1 / VIEW.zoom, -1 / VIEW.zoom);
    cx.fillStyle = pin ? COL.ink : COL.route;
    cx.beginPath(); cx.arc(0, -18, 9, 0, Math.PI * 2); cx.fill();
    cx.beginPath(); cx.moveTo(-7, -13); cx.lineTo(0, 0); cx.lineTo(7, -13); cx.closePath(); cx.fill();
    cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(0, -18, 3.5, 0, Math.PI * 2); cx.fill();
    cx.restore();
  }
  cx.translate(V.x, V.y); cx.rotate(V.yaw);
  cx.fillStyle = S.op === 'AUTONOMOUS' ? COL.route : COL.ink;
  roundRect(-2.4, -0.95, 4.8, 1.9, 0.5); cx.fill();
  cx.fillStyle = '#fff'; roundRect(0.6, -0.75, 1.2, 1.5, 0.3); cx.fill();
  cx.restore();
}
function roundRect(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r);
  cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }

connect(); requestAnimationFrame(draw);
</script>
</body>
</html>
