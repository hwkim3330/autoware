<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Autopilot Dashboard</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #16181d; --muted: #8a8f98; --line: #e3e5e9;
    --road: #e4e6ea; --lane: #ffffff; --route: #3e6ae1; --ap: #3e6ae1; --warn: #e8a317; --stop: #d93c3c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Pretendard", "Noto Sans KR", "Segoe UI", Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: minmax(300px, 30%) 1fr; height: 100vh; }
  .left { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column;
    padding: 28px 28px 20px; gap: 18px; }
  .gear { display: flex; gap: 14px; font-weight: 600; font-size: 20px; color: #c9ccd2; }
  .gear span.on { color: var(--ink); }
  .speed { font-size: 120px; font-weight: 300; line-height: 1; letter-spacing: -4px; }
  .unit { color: var(--muted); font-size: 18px; margin-top: -6px; }
  .ap { display: flex; align-items: center; gap: 10px; font-size: 16px; color: var(--muted); }
  .ap.on { color: var(--ap); }
  .ap .dot { width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
  .wheelbox { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 160px; }
  .wheel { width: min(220px, 70%); aspect-ratio: 1; transition: transform 0.12s linear; }
  .wheel.ap circle.rim { stroke: var(--ap); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 15px; color: var(--muted); }
  .stats b { color: var(--ink); font-weight: 600; }
  .btns { display: flex; gap: 10px; }
  button { flex: 1; border: 0; border-radius: 12px; padding: 14px 0; font-size: 16px; font-weight: 600;
    cursor: pointer; background: #eceef1; color: var(--ink); }
  button.primary { background: var(--ap); color: #fff; }
  button:active { transform: scale(0.98); }
  .right { position: relative; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
  .banner { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); background: var(--panel);
    border-radius: 14px; padding: 10px 18px; box-shadow: 0 4px 18px rgba(0,0,0,.08); font-size: 15px; display: none; }
  .banner.show { display: block; }
  .conn { position: absolute; right: 16px; bottom: 14px; font-size: 12px; color: var(--muted); }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 60vh; }
    .left { border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
    .speed { font-size: 84px; }
    .wheelbox { min-height: 120px; }
  }
</style>
</head>
<body>
<div class="app">
  <section class="left">
    <div class="gear"><span data-g="P">P</span><span data-g="R">R</span><span data-g="N">N</span><span data-g="D">D</span></div>
    <div>
      <div class="speed" id="speed">0</div>
      <div class="unit">km/h</div>
    </div>
    <div class="ap" id="ap"><span class="dot"></span><span id="aptext">수동 운전</span></div>
    <div class="wheelbox">
      <svg class="wheel" id="wheel" viewBox="-100 -100 200 200" aria-label="steering wheel">
        <circle class="rim" r="86" fill="none" stroke="#16181d" stroke-width="14"/>
        <path d="M-80,6 L-28,10 L-16,40 L16,40 L28,10 L80,6" fill="none" stroke="#16181d" stroke-width="12" stroke-linejoin="round"/>
        <circle r="18" fill="#16181d"/>
        <rect x="-4" y="-100" width="8" height="18" rx="3" fill="#3e6ae1"/>
      </svg>
    </div>
    <div class="stats">
      <div>조향 <b id="steer">0°</b></div>
      <div>계획 속도 <b id="plan">0</b></div>
      <div>측위 <b id="loc">-</b></div>
      <div>경로 <b id="route">-</b></div>
    </div>
    <div class="btns">
      <button class="primary" id="go">오토파일럿</button>
      <button id="stop">정지</button>
      <button id="reset">리셋</button>
    </div>
  </section>
  <section class="right">
    <canvas id="map"></canvas>
    <div class="banner" id="banner"></div>
    <div class="conn" id="conn">연결 중…</div>
  </section>
</div>
<script>
const WS_URL = new URLSearchParams(location.search).get('ws') || 'ws://127.0.0.1:8765/ws';
const STEER_RATIO = 8;
const S = { ego: null, lanes: [], polys: [], route: [], traj: [], op: '', frame: null };
let ws, sendQ = [];

function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
document.getElementById('go').onclick = () => send({ cmd: 'drive' });
document.getElementById('stop').onclick = () => send({ cmd: 'stop' });
document.getElementById('reset').onclick = () => send({ cmd: 'respawn' });

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { document.getElementById('conn').textContent = '게이트웨이 연결됨'; };
  ws.onclose = () => { document.getElementById('conn').textContent = '재연결 중…'; setTimeout(connect, 1500); };
  ws.onmessage = (ev) => {
    let d; try { d = JSON.parse(ev.data); } catch { return; }
    if (d.type === 'lanes') { S.lanes = d.pts || []; S.polys = d.polys || []; return; }
    if (!d.ego) return;
    S.frame = d; S.ego = d.ego; S.op = (d.operationMode || {}).mode || '';
    S.route = (d.route || {}).routePath || []; S.traj = (d.route || {}).trajPath || [];
    updatePanel(d);
  };
}

let lastSpeed = 0;
function updatePanel(d) {
  const kmh = Math.abs(d.ego.speedKmh || 0);
  lastSpeed = kmh;
  document.getElementById('speed').textContent = Math.round(kmh);
  const v = d.vehicle || {};
  const steer = v.steerDeg || 0;
  document.getElementById('steer').textContent = steer.toFixed(1) + '°';
  document.getElementById('plan').textContent = Math.round(v.plannedKmh || 0);
  const loc = d.localization || {};
  document.getElementById('loc').textContent = loc.converged ? 'OK' : '대기';
  document.getElementById('route').textContent = ((d.route || {}).state || '-');
  // + steer = left in Autoware; rotate the wheel counter-clockwise for left
  document.getElementById('wheel').style.transform = `rotate(${-steer * STEER_RATIO}deg)`;
  const ap = S.op === 'AUTONOMOUS';
  document.getElementById('ap').classList.toggle('on', ap);
  document.getElementById('wheel').classList.toggle('ap', ap);
  document.getElementById('aptext').textContent = ap ? '오토파일럿 주행 중' : (S.op === 'STOP' ? '정지' : '수동 운전');
  const gear = (d.ego.speedKmh || 0) < -0.5 ? 'R' : (ap || kmh > 0.5 ? 'D' : 'P');
  document.querySelectorAll('.gear span').forEach(s => s.classList.toggle('on', s.dataset.g === gear));
  const b = document.getElementById('banner');
  const msg = d.cmdResult || '';
  const show = msg && !/^AUTONOMOUS$/.test(msg) && !/manual teleop active/.test(msg);
  b.textContent = msg; b.classList.toggle('show', !!show);
}

// ---------- map (heading-up, ego near the bottom third) ----------
const cv = document.getElementById('map'), cx = cv.getContext('2d');
// Render at 1x even on a 4K/HiDPI screen: at devicePixelRatio 2 the full-window canvas
// was 4x the pixels and every frame redrew every lane in the map -- the dashboard crawled.
function resize() { const r = cv.getBoundingClientRect(), k = 1;
  cv.width = r.width * k; cv.height = r.height * k; cx.setTransform(k, 0, 0, k, 0, 0); }
addEventListener('resize', resize); resize();

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const COL = { bg: css('--bg'), road: css('--road'), lane: css('--lane'), route: css('--route'), ink: css('--ink') };
// Only lanes near the car are drawn; the subset is refreshed twice a second, not per frame.
let nearPolys = [];
setInterval(() => {
  if (!S.ego) return;
  const R = 260, ex = S.ego.x, ey = S.ego.y;
  nearPolys = S.polys.filter(pl => pl.some(p => Math.abs(p[0] - ex) < R && Math.abs(p[1] - ey) < R));
}, 500);

let zoom = 4.0; // px per metre, eased with speed
let lastDraw = 0;
function draw(t) {
  requestAnimationFrame(draw);
  if (t - lastDraw < 33) return;          // ~30 fps is plenty for a map
  lastDraw = t;
  const W = cv.clientWidth, H = cv.clientHeight;
  cx.fillStyle = COL.bg; cx.fillRect(0, 0, W, H);
  if (S.ego) {
    const target = (H / 760) * (9.0 - Math.min(lastSpeed, 60) / 60 * 4.5);   // window-relative, zoom out with speed
    zoom += (target - zoom) * 0.05;
    const yaw = (S.ego.yawDeg || 0) * Math.PI / 180;
    cx.save();
    cx.translate(W / 2, H * 0.68);
    cx.scale(zoom, -zoom);              // world y up
    cx.rotate(-(yaw - Math.PI / 2));    // heading up
    cx.translate(-S.ego.x, -S.ego.y);
    // road surface: thick strokes along lane polylines, then thin lane lines
    const stroke = (lw, col) => {
      cx.strokeStyle = col; cx.lineWidth = lw; cx.lineCap = 'round'; cx.lineJoin = 'round';
      for (const pl of nearPolys) { if (!pl.length) continue;
        cx.beginPath(); cx.moveTo(pl[0][0], pl[0][1]); for (const p of pl) cx.lineTo(p[0], p[1]); cx.stroke(); }
    };
    stroke(3.6, COL.road);
    cx.setLineDash([1.5, 2.5]);
    stroke(0.15, COL.lane);
    cx.setLineDash([]);
    const path = (pts, lw, col, alpha) => { if (pts.length < 2) return;
      cx.globalAlpha = alpha; cx.strokeStyle = col; cx.lineWidth = lw; cx.beginPath();
      cx.moveTo(pts[0][0], pts[0][1]); for (const p of pts) cx.lineTo(p[0], p[1]); cx.stroke(); cx.globalAlpha = 1; };
    const routeCol = COL.route;
    path(S.route, 1.6, routeCol, 0.35);
    path(S.traj, 1.1, routeCol, 0.9);
    // ego car
    cx.translate(S.ego.x, S.ego.y); cx.rotate(yaw);
    cx.fillStyle = S.op === 'AUTONOMOUS' ? routeCol : '#16181d';
    roundRect(-2.4, -0.95, 4.8, 1.9, 0.5); cx.fill();
    cx.fillStyle = '#fff'; roundRect(0.6, -0.75, 1.2, 1.5, 0.3); cx.fill();
    cx.restore();
  }
}
function roundRect(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r);
  cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }

connect(); requestAnimationFrame(draw);
</script>
</body>
</html>
